<!doctype html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>助教</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
  <style>
    :root {
      --bg:#f7f7f8; --panel:#fff; --side:#f2f3f5; --fg:#1a1a1a; --sub:#8a8a90;
      --border:#e6e6e9; --hover:#ececef; --active:#e3e6ff; --userbubble:#eef0f4;
      --accent:#4c6ef5; --accent-fg:#fff; --shimmer:#c8c8cc; --danger:#e5484d;
    }
    html[data-theme="dark"] {
      --bg:#17181b; --panel:#1f2023; --side:#202124; --fg:#e8e8ea; --sub:#8a8a90;
      --border:#303136; --hover:#2a2b30; --active:#2f3550; --userbubble:#2c2d31;
      --accent:#4c6ef5; --accent-fg:#fff; --shimmer:#55565c; --danger:#ff6b6b;
    }
    * { box-sizing:border-box; }
    /* 图标柔和:圆角线端/连接 + 略细 */
    .iconbtn svg, .act svg, .ic, .mic svg, .plus svg {
      stroke-linecap:round; stroke-linejoin:round; stroke-width:1.6; }
    body { margin:0; height:100vh; height:100dvh; display:flex; overflow:hidden; color:var(--fg);
      background:var(--bg); font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
      font-size:14px; transition:background .2s,color .2s; }
    button { font-family:inherit; }

    /* ---- 侧边栏 ---- */
    #side { width:260px; flex:none; background:var(--side); border-right:1px solid var(--border);
      display:flex; flex-direction:column; transition:width .18s,padding .18s; overflow:hidden; }
    body.collapsed #side { width:0; border:none; }
    .side-sec { padding:8px; }
    .side-head { display:flex; align-items:center; gap:4px; }
    .side-head .user-row { flex:1; min-width:0; }
    .side-head .iconbtn { flex:none; color:var(--sub); }
    .side-head .iconbtn:hover { background:var(--hover); color:var(--fg); }
    .row { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px;
      cursor:pointer; color:var(--fg); white-space:nowrap; overflow:hidden; }
    .row:hover { background:var(--hover); }
    .row.active { background:var(--active); }
    .row .ic { flex:none; width:18px; height:18px; opacity:.85; }
    .row .tx { overflow:hidden; text-overflow:ellipsis; flex:1; }
    .user-row { font-weight:600; }
    .label { color:var(--sub); font-size:12px; padding:12px 13px 6px; }
    #convs { flex:1; overflow-y:auto; padding:0 8px 12px; }
    .conv { position:relative; }
    .conv .dots { position:absolute; right:6px; top:50%; transform:translateY(-50%);
      opacity:0; border:none; background:transparent; color:var(--sub); cursor:pointer;
      font-size:16px; padding:2px 6px; border-radius:6px; }
    .conv:hover .dots { opacity:1; }
    .conv:hover .dots:hover { background:var(--border); }
    .pin { color:var(--accent); font-size:11px; margin-left:4px; }

    /* ---- 主区 ---- */
    #main { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
    #top { height:54px; flex:none; display:flex; align-items:center; padding:0 12px; gap:4px; }
    .iconbtn { background:none; border:none; color:var(--sub); cursor:pointer;
      width:38px; height:38px; border-radius:9px; display:grid; place-items:center; }
    .iconbtn:hover { background:var(--hover); color:var(--fg); }
    .iconbtn svg { width:21px; height:21px; }
    #title { flex:1; text-align:center; font-weight:600; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; padding:0 8px; }

    #log { flex:1; overflow-y:auto; padding:10px 0 20px; }
    .wrap { max-width:760px; margin:0 auto; padding:0 24px; }
    .empty { height:100%; display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:700; color:var(--fg); }
    .msg { margin:14px 0; display:flex; flex-direction:column; }
    .msg.user { align-items:flex-end; }
    .bubble { max-width:78%; padding:10px 14px; border-radius:14px; line-height:1.7;
      white-space:pre-wrap; word-break:break-word; }
    .user .bubble { background:var(--userbubble); }
    .bot .bubble { background:transparent; padding-left:0; max-width:100%; }
    .acts { display:flex; gap:4px; margin-top:5px; }
    .user .acts { opacity:0; }
    .msg.user:hover .acts { opacity:1; }
    .act { background:none; border:none; color:var(--sub); cursor:pointer; font-size:12px;
      padding:3px 7px; border-radius:7px; display:flex; align-items:center; gap:3px; }
    .act:hover { background:var(--hover); color:var(--fg); }

    /* 状态:纯文字 + 从左到右柔和呼吸(不消失、慢、跨状态连续)*/
    .status { color:var(--sub); font-size:13px; margin:4px 0; display:inline-block;
      background:linear-gradient(90deg, var(--sub) 38%, var(--fg) 50%, var(--sub) 62%);
      background-size:220% 100%; -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; animation:shimmer 2.6s ease-in-out infinite; }
    @keyframes shimmer { 0%{background-position:115% 0;} 100%{background-position:-115% 0;} }

    /* ---- 输入框 ---- */
    /* 左右留最小距离:窗口窄到贴近后,是框变窄、距离不变(不再贴边) */
    #composer { padding:8px 16px 18px; }
    .cbox { max-width:760px; margin:0 auto; border:1.5px solid var(--accent); border-radius:16px;
      background:var(--panel); padding:8px 10px 8px 14px; }
    .cbox textarea { width:100%; border:none; outline:none; resize:none; background:transparent;
      color:var(--fg); font-family:inherit; font-size:15px; line-height:1.5; max-height:180px; }
    .crow { display:flex; align-items:center; margin-top:4px; }
    .plus { width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
      background:none; color:var(--fg); font-size:19px; cursor:pointer; display:grid; place-items:center; }
    .plus:hover { background:var(--hover); }
    .cright { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .mic { width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:none;
      color:var(--fg); cursor:pointer; display:grid; place-items:center; }
    .mic:hover { background:var(--hover); }
    .mic.rec { color:var(--danger); border-color:var(--danger); }
    .send { width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
      background:var(--accent); color:#fff; display:grid; place-items:center; }
    .send:disabled { opacity:.35; cursor:default; }
    .files { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
    .chip { background:var(--userbubble); border-radius:8px; padding:4px 8px; font-size:12px;
      display:flex; gap:6px; align-items:center; }
    .chip button { border:none; background:none; color:var(--sub); cursor:pointer; }

    /* 悬停菜单 */
    .menu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--border);
      border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,.22); padding:5px; min-width:120px; }
    .menu button { display:flex; width:100%; gap:8px; align-items:center; background:none; border:none;
      color:var(--fg); padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13px; text-align:left; }
    .menu button:hover { background:var(--hover); }
    .menu button.del { color:var(--danger); }

    /* 内联编辑 */
    .editbox { border:1.5px solid var(--accent); border-radius:14px; background:var(--panel);
      padding:8px 10px; display:flex; gap:8px; align-items:flex-end; width:78%; }
    .editbox textarea { flex:1; border:none; outline:none; resize:none; background:transparent;
      color:var(--fg); font-family:inherit; font-size:15px; line-height:1.5; max-height:160px; }

    /* ---- markdown / 公式 / 图 渲染(字号参考豆包)---- */
    .bot .bubble { font-size:15px; line-height:1.75; }
    .bot .bubble > :first-child { margin-top:0; }
    .bot .bubble > :last-child { margin-bottom:0; }
    .bot .bubble h1 { font-size:20px; margin:.7em 0 .4em; }
    .bot .bubble h2 { font-size:17px; margin:.7em 0 .4em; }
    .bot .bubble h3 { font-size:15px; margin:.6em 0 .3em; }
    .bot .bubble p { margin:.5em 0; }
    .bot .bubble ul, .bot .bubble ol { padding-left:1.5em; margin:.4em 0; }
    .bot .bubble li { margin:.25em 0; }
    .bot .bubble code { background:var(--userbubble); padding:1px 5px; border-radius:5px;
      font-size:.9em; font-family:ui-monospace,Menlo,Consolas,monospace; }
    .bot .bubble pre { background:var(--userbubble); padding:11px 13px; border-radius:10px;
      overflow-x:auto; margin:.5em 0; }
    .bot .bubble pre code { background:none; padding:0; }
    .bot .bubble table { border-collapse:collapse; margin:.5em 0; }
    .bot .bubble th, .bot .bubble td { border:1px solid var(--border); padding:5px 11px; }
    .bot .bubble blockquote { border-left:3px solid var(--border); margin:.5em 0; padding-left:12px; color:var(--sub); }
    .diagram { margin:.6em 0; overflow-x:auto; }
    .diagram svg { max-width:100%; height:auto; }
    .katex-display { overflow-x:auto; overflow-y:hidden; padding:2px 0; }
    .dls { margin-top:8px; }
    .dlbtn { display:inline-flex; gap:6px; align-items:center; margin:4px 6px 0 0; padding:7px 12px;
      border:1px solid var(--accent); border-radius:9px;
      background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent);
      cursor:pointer; font-size:13px; font-weight:500; text-decoration:none; }
    .dlbtn:hover { background:color-mix(in srgb, var(--accent) 22%, transparent); }

    /* 菜单渐入 */
    .menu { animation: pop .12s ease-out; transform-origin: top left; }
    @keyframes pop { from { opacity:0; transform:scale(.95) translateY(-4px); } to { opacity:1; transform:none; } }
    /* 麦克风录音脉冲 */
    .mic.rec { color:var(--danger); border-color:var(--danger); animation: micpulse 1.1s ease-in-out infinite; }
    @keyframes micpulse { 0%,100% { box-shadow:0 0 0 0 rgba(229,72,77,.45); } 50% { box-shadow:0 0 0 7px rgba(229,72,77,0); } }
    /* 助教操作图标 */
    .act svg { width:16px; height:16px; }
    /* 内联编辑取消键(左侧、加大) */
    .editbox .ecancel { background:none; border:none; color:var(--sub); cursor:pointer; font-size:24px;
      line-height:1; padding:0 6px; align-self:center; }
    .editbox .ecancel:hover { color:var(--fg); }
    /* 用户名可点 */
    .user-row { cursor:pointer; }
    /* 主题化弹窗 */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:60; display:grid;
      place-items:center; animation:fade .12s; }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    .modal { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:14px;
      padding:20px 22px; width:330px; max-width:90vw; box-shadow:0 16px 46px rgba(0,0,0,.35);
      animation:pop .14s ease-out; transform-origin:center; }
    .modal h3 { margin:0 0 12px; font-size:16px; }
    .modal label { display:block; font-size:12px; color:var(--sub); margin:10px 0 4px; }
    .modal input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--border);
      border-radius:9px; background:var(--userbubble); color:var(--fg); font-size:14px; }
    .modal input:focus { outline:none; border-color:var(--accent); }
    .modal .mbtns { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    .modal .mbtns button { padding:8px 16px; border-radius:9px; border:1px solid var(--border);
      background:none; color:var(--fg); cursor:pointer; font-size:13px; }
    .modal .mbtns .primary { background:var(--accent); color:#fff; border:none; }
    .modal .merr { color:var(--danger); font-size:12px; min-height:16px; margin-top:8px; }

    /* ---- 响应式:手机/平板 ---- */
    #backdrop { display:none; }
    @media (max-width:900px) {
      #side { position:fixed; left:0; top:0; bottom:0; z-index:40;
        box-shadow:2px 0 18px rgba(0,0,0,.35); width:80%; max-width:300px; }
      body.collapsed #side { width:0; box-shadow:none; }
      #backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35; }
      body.collapsed #backdrop { display:none; }
      body:not(.collapsed) #backdrop { display:block; }
      .wrap { padding:0 14px; }
      .bubble { max-width:90%; }
      #title .t { font-size:15px; }
      .editbox { width:92%; }
    }
  </style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="side">
    <div class="side-sec side-head">
      <div class="row user-row" id="userRow"><span class="tx" id="userName">…</span></div>
      <button class="iconbtn" id="toggleSideIn" title="收起侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3.5"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>
    <div class="side-sec" id="tutorList"></div>
    <div class="label">历史对话</div>
    <div id="convs"></div>
  </div>

  <div id="main">
    <div id="top">
      <button class="iconbtn" id="toggleSide" title="收起/展开侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3.5"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button class="iconbtn" id="newChat" title="新建对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <div id="title"><span id="titleT">新对话</span></div>
      <button class="iconbtn" id="themeBtn" title="深色/浅色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/></svg>
      </button>
    </div>
    <div id="log"></div>
    <div id="composer">
      <div class="cbox">
        <div class="files" id="files"></div>
        <textarea id="input" rows="1" placeholder="发消息并按 shift+⏎ / option+⏎ 换行"></textarea>
        <div class="crow">
          <button class="plus" id="plus" title="上传图片/文件">＋</button>
          <input type="file" id="fileInput" multiple style="display:none" />
          <div class="cright">
            <button class="mic" id="mic" title="语音输入" style="display:none">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button class="send" id="send" title="发送">↑</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/vendor/katex/auto-render.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
